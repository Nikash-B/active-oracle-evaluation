[label_efficiency_robustness.shared_strategy]
uniform = "random"
disagreement_all = "disagreement"
phase_balanced = "phase_balanced"

# Settings of the lineage drift comparison
# (python -m active_oracle_evaluation.experiments.lineage_drift).

[lineage_drift]
# Seed of the freshly initialized network that gives the cosine a scale. Chosen for this study;
# the paper does not report this baseline.
baseline_seed = 0
# Minimum number of legal moves for a suite position to count in the move agreement. Chosen for this
# study: a position with one legal move cannot show disagreement. With 2 the count is the
