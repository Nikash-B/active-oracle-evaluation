strong_tier = "gnubg0,gnubg1,gnubg2,search2,sel3,puretd"
# Trial-level bootstrap resamples for the Elo intervals. Chosen for this study.
boots = 1000
# Bradley-Terry iterations per bootstrap refit. Chosen for this study.
bootstrap_iterations = 200
# Percentiles of the pivotal bootstrap interval (a 95% interval). Chosen for this study.
