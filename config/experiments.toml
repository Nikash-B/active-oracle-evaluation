seed = 20260628
# Self-play agent that generates the games. Chosen for this study; it matches the suite's sampler.
sampler = "heuristic"
# Cap on plies per self-play game. Chosen for this study; it equals build_suite's max_plies, which
# the replay must match.
max_plies = 400

# Settings of the label-efficiency experiment
# (python -m active_oracle_evaluation.experiments.label_efficiency).

[label_efficiency]
# Label budgets K: the paper's appendix "Experimental protocol", paragraph "Frozen decision suite
# and active selection" ("K in {50, 100, 250, 500, 1000}"), and the label-efficiency figure in the
# results subsection "Active selection orders the competitive cluster from fewer labels".
ks = [50, 100, 250, 500, 1000]
# Draws per design and budget for the 0-ply run of the paper's the label-efficiency figure and of
