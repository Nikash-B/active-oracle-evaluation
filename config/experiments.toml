# Settings of the per-decision PR difference of the duplicate-dice measurement pair
# (python -m active_oracle_evaluation.experiments.measurement_pair).

[measurement_pair]
# Bootstrap replicates. Chosen for this study.
n_boot = 10000
# Bootstrap seed. Chosen for this study.
seed = 0
# Two-sided 95% normal quantile z of the sample-size relation: the paper's appendix "Statistical
# protocol: derivations and definitions", paragraph "Sample-size relation" (written there as 1.96).
z = 1.959963984540054
# Percentiles of the bootstrap interval (a 95% interval): the paper's appendix "Statistical
# protocol: derivations and definitions", paragraph "Clustered bootstrap" ("2.5th-97.5th
# percentiles").
interval_percentiles = [2.5, 97.5]
# Mean paired points-per-game difference of the pair, scored by game outcome: the paper's appendix
# "Experimental protocol", paragraph "Measurability experiment" ("-0.246 points per game"), and the
# results subsection "Per-decision scoring needs fewer trials than duplicate-dice outcomes".
outcome_diff = 0.2460
# Paired SD of the points-per-game difference, per duplicate-dice trial: the paper's appendix
# "Experimental protocol", paragraph "Measurability experiment" ("a paired one of 1.0040"), and
# appendix "Statistical protocol: derivations and definitions", paragraph "Sample-size relation".
outcome_sd = 1.0040
# Unpaired SD of the points-per-game outcome, per game: the paper's appendix "Experimental
# protocol", paragraph "Measurability experiment" ("unpaired standard deviation of 1.4893").
outcome_sd_unpaired = 1.4893

# Settings of the Nash-averaging experiment
# (python -m active_oracle_evaluation.experiments.nash_averaging).
# The paper names Nash averaging in appendix "Validity of the oracle rating", paragraph "Panel
# composition", and the seven-agent, 15,000-games-per-pairing round-robin it reads in paragraph
# "Transitivity and a reversal"; both come from the data file, not from these settings.

[nash_averaging]
# PR = 500 times the mean equity lost per decision; the paper's section "Evaluation protocol"
# (paragraph "Rating", and line 8 of the algorithm "Performance Rating on a frozen decision suite").
pr_scale = 500.0
# Decimals of PR in the report, as the paper prints PR; chosen for this study.
pr_decimals = 1

# Maximum-entropy equilibrium solver (feasibility LP, then entropy ascent). Every value is
# chosen for this study.
# Largest (A p)_i that still counts as an equilibrium.
feasibility_tol = 1e-9
# Entropy-ascent iterations, step size and stopping change (max absolute change of p).
ascent_iterations = 2000
ascent_step = 1e-3
ascent_convergence = 1e-12
# Added inside the logarithm so that zero mass stays finite.
log_epsilon = 1e-300
# Agents with more equilibrium mass than this count as the support.
support_threshold = 1e-6
# Tolerance of the antisymmetry check on the advantage matrix.
antisymmetry_atol = 1e-12

# Clone cells (each agent duplicated in turn). The duplicate splits clone_games evenly with its
# original, the games per pairing of the round-robin (appendix "Validity of the oracle rating",
# paragraph "Transitivity and a reversal": 15,000 games per pairing).
clone_games = 15000
# Bradley-Terry MM fit of the clone cells: iterations and stopping change of log-strength;
# chosen for this study.
bt_iterations = 2000
bt_convergence = 1e-12
# Agent pinned at 0 Elo; the paper's sections "Related work" and "Evaluation protocol" anchor Elo to
# pubeval. The fallback, pinned when pubeval is the duplicated agent, is chosen for this study.
anchor = "pubeval"
anchor_fallback = "v2"

[oracle_depth]
# Shared positions per oracle. Chosen for this study.
n = 500
# Suite seed. The release's global seed (README, Pinning section); paper: appendix "Reproducibility,
# release and compute", paragraph "Released code and data" (every run is seeded).
seed = 20260628
# Agent whose self-play generates the positions. Chosen for this study.
sampler = "heuristic"
# GNU Backgammon depths in the oracle ladder, in ply. Paper: appendix "Experimental protocol",
# paragraph "Common setup and harness" (scored at 0-ply, re-scored at 2-ply to check robustness).
gnubg_plies = [0, 2]
# Kendall tau the strong oracles must reach. Paper: results subsection "Oracle regret separates the
# panel into five tiers" (the agreement of 0.9 required of a second reference).
tau_robust = 0.9
# The pubeval tau must lie more than this below the strong-strong tau. Chosen for this study.
pubeval_margin = 0.1

# Settings of the anchored round-robin with the oracle in the pool
# (python -m active_oracle_evaluation.experiments.oracle_pool_elo).

[oracle_pool_elo]
