# Settings of the reference-quality experiment
# (python -m active_oracle_evaluation.experiments.yahtzee_reference_quality).

[yahtzee_reference_quality]
# Games per suite. From the paper: each suite holds the 117,000 decisions of 3,000 games (appendix
# "Solitaire Yahtzee: exact ground truth", paragraph "Agent panel and suites").
games = 3000
# Seed of the decision suites. Chosen for this study.
suite_seed = 20260901
# Seed of the agent panel and of the shared-draw reference. Chosen for this study; the
# default seed of build_panel.
panel_seed = 20260831
# Base of the noise seed of the independent references; draw d at scale sigma uses
# (base + 1000 * d) + round(1000 * sigma). Chosen for this study.
indep_seed = 770001
# Independent noise draws per sigma with --independent. Chosen for this study as the command-line
