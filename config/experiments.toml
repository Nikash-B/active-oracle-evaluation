min_legal_moves = 2
# Agent whose moves the others are compared with. From the paper: appendix "Agent configurations",
# paragraph "Shared initialization" ("the outcome-head network").
reference_agent = "v2"
# Agents that start from the reference network. Chosen for this study; the paper reports v2init, ppo
# and az75 in appendix "Agent configurations", paragraph "Shared initialization".
lineage_agents = ["v2init", "ppo", "az25", "az50", "az75"]
# Agents trained separately from the reference network. Chosen for this study; the paper reports
# newbest as "an unrelated agent" in appendix "Agent configurations", paragraph "Shared
# initialization", and in the results subsection "The rate of large errors separates near-tied
# agents, and all agents err more in contact".
outside_agents = ["newbest", "pubeval", "v1", "dxlarge", "dlarge", "heuristic"]
# Checkpoints whose recorded training metadata is printed. Chosen for this study.
provenance_checkpoints = ["policy_value_v2init", "ppo", "az75"]

# Tensor-by-tensor comparisons, in print order. Chosen for this study; the paper reports the PPO
# trunk cosine (appendix "Agent configurations", paragraph "Shared initialization"). When
# outcome_to_policy_value is true, the reference is an OutcomeMLP and its tensor names are mapped
