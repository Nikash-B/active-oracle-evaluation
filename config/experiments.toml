# (python -m active_oracle_evaluation.experiments.validity_intervals).

[validity_intervals]
# Agent specs of the eight-agent panel: built-in agents by name, checkpoints as label:path relative
# to the repo root. From the paper's appendix "Validity of the oracle rating", paragraph "Anchored
# round-robin" (all eight agents) and the table of PR and anchored Elo of the eight agents.
agent_specs = [
    "random",
    "heuristic",
    "pubeval",
    "v1:models/v1.pt",
    "v2:models/v2.pt",
    "ppo:models/ppo.pt",
    "az:models/az75.pt",
    "distilled:models/distilled.pt",
]
# Agents whose pairwise differences are reported (the competitive cluster, 15 pairs). From the
# paper's appendix "Validity of the oracle rating", paragraph "Anchored round-robin" ("the cluster's
# 15 pairs").
cluster = ["pubeval", "v1", "v2", "ppo", "az", "distilled"]
# Dice-bank seed of the round-robin replay. Chosen for this study; it is the seed of the
# elo_validity round-robin (the [elo_validity] table), so the replay matches it.
dice_seed = 20260628
# Duplicate-dice trials per pairing. From the paper's appendix "Validity of the oracle rating",
# paragraph "Anchored round-robin" (60 duplicate-dice trials, 120 games, per pairing).
pairs = 60
# Oracle evaluation depth: 0-ply, from the paper's section "Evaluation protocol", paragraph
# "Oracle".
plies = 0
# Bootstrap replicates. From the paper's appendix "Validity of the oracle rating", paragraph
# "Anchored round-robin" ("95% bootstrap interval (2,000 replicates)").
boot = 2000
# Seed of the bootstrap resampling. Chosen for this study.
bootstrap_seed = 20260813
# Oracle scoring processes. Chosen for this study; results do not depend on it.
workers = 6
# Percentiles of the 95% bootstrap interval. From the paper's appendix "Validity of the oracle
# rating", paragraph "Anchored round-robin".
interval_percentiles = [2.5, 97.5]
# Family-wise (Holm) and false-discovery (Benjamini-Hochberg) level of the multiplicity counts.
# Chosen for this study.
alpha = 0.05
# Largest allowed difference between the Elo refit and the Elo stored in elo_validity.json.
# Chosen for this study.
refit_tolerance = 1e-9

# Settings of the XG cross-check (python -m active_oracle_evaluation.experiments.xg_oracle).

[xg_oracle]
# Agent specs, in the row set of the paper's the table of PR under GNU Backgammon and eXtreme Gammon
# (appendix "Validity of the oracle rating", paragraph "Second engine"). The az spec is the
# AlphaZero row, v1 and v2 the TD-lambda scalar and outcome heads.
agents = [
    "random",
    "heuristic",
    "pubeval",
    "v1:models/v1.pt",
    "v2:models/v2.pt",
    "ppo:models/ppo.pt",
    "az:models/az75.pt",
    "distilled:models/distilled.pt",
]
# GNU Backgammon depths the XG ranking is compared with. From the paper: the 0-ply and 2-ply columns
# of the table of PR under GNU Backgammon and eXtreme Gammon (appendix "Validity of the oracle
# rating").
gnubg_plies = [0, 2]
# Performance Rating = mean equity loss per decision times 500. From the paper: section "Evaluation
# protocol", the PR definition above the algorithm "Performance Rating on a frozen decision suite";
# it is the XG and GNU Backgammon convention.
pr_scale = 500
# Kendall tau at or above which XG counts as agreeing with GNU Backgammon. From the paper: results
# subsection "Oracle regret separates the panel into five tiers" ("the agreement of 0.9 that we
# require of a second reference").
tau_threshold = 0.9
# Fewest legal afterstates, and fewest XG candidates matched to them, for a decision to count.
# Chosen for this study (a decision with one option has no equity loss).
min_candidates = 2

# Settings of the degraded-reference selection experiment
# (python -m active_oracle_evaluation.experiments.yahtzee_degraded_steering).

[yahtzee_degraded_steering]
# Games per suite. From the paper: each suite holds the 117,000 decisions of 3,000 games (appendix
# "Solitaire Yahtzee: exact ground truth", paragraph "Agent panel and suites").
games = 3000
# Random draws of the labeled set per budget. From the paper: 200 random draws (appendix "Solitaire
# Yahtzee: exact ground truth", caption of the Yahtzee label-efficiency figure).
seeds = 200
# Seed of the decision suites. Chosen for this study; the same value as the suite seed of
# yahtzee_reference_quality, so both experiments label the same suites.
suite_seed = 20260901
# Seed of the agent panel. Chosen for this study; the default seed of build_panel.
panel_seed = 20260831
# Label budgets K. Chosen for this study; the paper quotes K = 32 and K = 512 (appendix "Solitaire
# Yahtzee: exact ground truth", paragraph "Selection from a weak reference").
budgets = [8, 16, 32, 64, 128, 256, 512]
# The near-tied panel. From the paper: optimal, eta = 0.5 and eta = 1 (appendix "Solitaire Yahtzee:
# exact ground truth", caption of the Yahtzee label-efficiency figure).
agents = ["optimal", "noisy_s0.5", "noisy_s1"]
# Noise scales of the degraded reference, after the exact design at sigma = 0. The noise family is
# from the paper (appendix "Solitaire Yahtzee: exact ground truth", paragraph "Agent panel and
# suites"); the paper quotes the reference 129 points per game from optimal, sigma = 50 (paragraph
# "Selection from a weak reference"). The other scales are chosen for this study.
reference_sigmas = [0.5, 1.0, 2.0, 5.0, 15.0, 50.0]
# Base of the reference noise seed; scale sigma uses base + round(1000 * sigma). Chosen for
# this study; the same base as draw 0 of yahtzee_reference_quality --independent, so the
# reference deficits read from its output describe these references.
reference_seed_base = 770001
# Base of the tie-break permutation seed; draw s uses base + s. Chosen for this study.
jitter_seed_base = 10000

# Settings of the Yahtzee label-efficiency experiment
# (python -m active_oracle_evaluation.experiments.yahtzee_label_efficiency).

[yahtzee_label_efficiency]
# Games per suite. From the paper: each suite holds the 117,000 decisions of 3,000 games (appendix
# "Solitaire Yahtzee: exact ground truth", paragraph "Agent panel and suites").
games = 3000
# Random draws of the labeled set per rule and budget. Chosen for this study.
seeds = 100
# Seed of the decision suites. Chosen for this study.
suite_seed = 20260901
# Seed of the agent panel. Chosen for this study; the default seed of build_panel.
panel_seed = 20260831
# Suites, in run order. From the paper: drawn either from optimal play or from a mixture of all nine
# agents (appendix "Solitaire Yahtzee: exact ground truth", paragraph "Agent panel and suites").
suites = ["optimal", "mixture"]
# Selection rules. From the paper: "all three rules we tested" (section "In a solved game, suite
# regret recovers the ranking but not the magnitudes", paragraph "The ranking is exact; the
# magnitudes are not").
rules = ["uniform", "disagreement", "regret_importance"]
# Label budgets K. From the paper: the budget grows from 8 to 8,192 labels (appendix "Solitaire
# Yahtzee: exact ground truth", paragraph "The estimand gap").
budgets = [8, 32, 128, 512, 2048, 8192]
# Agents left out, which gives the paper's nine-agent panel (appendix "Solitaire Yahtzee: exact
# ground truth", paragraph "Agent panel and suites"). fixed_order breaks its dice-blind ties
# differently when it is labelled and when it is priced, so its labels and its deficit describe
# different policies.
drop = ["fixed_order"]
# Selection rule of the leave-one-agent-out check. Chosen for this study.
loao_rule = "disagreement"
# Label budget of the leave-one-agent-out check. Chosen for this study.
loao_budget = 512
# Base of the tie-break permutation seed; draw s uses base + s. Chosen for this study.
tie_seed_offset = 10000
# Base of the tie-break permutation seed in the leave-one-agent-out check. Chosen for this study.
loao_tie_seed_offset = 20000

# Settings of the exact Yahtzee panel evaluation
# (python -m active_oracle_evaluation.experiments.yahtzee_panel).

[yahtzee_panel]
# Seed of the noisy agents; agent eta uses seed + round(1000 * eta). Chosen for this study.
seed = 20260831
# Largest allowed |V*(start) - 254.5877|. The anchor is from the paper (appendix "Solitaire Yahtzee:
# exact ground truth", paragraph "The solved game"); the tolerance is chosen for this study.
v_star_tolerance = 5e-5
# Largest allowed |SD of optimal - 59.61|. The anchor is from the paper (appendix "Solitaire
# Yahtzee: exact ground truth", paragraph "The solved game"); the tolerance is chosen for this
# study.
sd_tolerance = 5e-3
# Largest allowed performance-difference identity error. Chosen for this study; the paper reports
# the achieved 7.1e-13 (appendix "Solitaire Yahtzee: exact ground truth", paragraph "Check on policy
# evaluation").
identity_tolerance = 1e-9

# Settings of the Yahtzee rank-recovery and estimand-gap experiment
# (python -m active_oracle_evaluation.experiments.yahtzee_rank_recovery).

[yahtzee_rank_recovery]
# Games per suite. From the paper: each suite holds the 117,000 decisions of 3,000 games (appendix
# "Solitaire Yahtzee: exact ground truth", paragraph "Agent panel and suites").
games = 3000
# Random draws of the labeled set per rule and budget. From the paper: 200 random draws (appendix
# "Solitaire Yahtzee: exact ground truth", caption of the Yahtzee label-efficiency figure).
seeds = 200
# Seed of the decision suites. Chosen for this study.
suite_seed = 20260901
# Seed of the agent panel. Chosen for this study; the default seed of build_panel.
panel_seed = 20260831
# Label budgets K. From the paper: budgets from 8 up to 8,192 labels (appendix "Solitaire Yahtzee:
# exact ground truth", paragraph "The estimand gap" and caption of the Yahtzee label-efficiency
# figure).
budgets = [8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192]
# Selection rules. From the paper: the three rules of the section "In a solved game, suite regret
# recovers the ranking but not the magnitudes", paragraph "The ranking is exact; the magnitudes are
# not"; regret importance has no phase strata here (appendix "Solitaire Yahtzee: exact ground
# truth", caption of the Yahtzee label-efficiency figure).
rules = ["uniform", "disagreement", "regret_importance"]
# Base of the tie-break permutation seed; draw s uses base + s. Chosen for this study.
jitter_seed_base = 10000
# Percentiles of the Kendall tau interval over draws. Chosen for this study.
tau_percentiles = [2.5, 97.5]

# Named agent subsets for --preset; each also names the output file unless --tag is given.
[yahtzee_rank_recovery.presets]
# The nine-agent panel: every agent but fixed_order. From the paper: the panel of nine (section "In
