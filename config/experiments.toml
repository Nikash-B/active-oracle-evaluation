# Settings of every experiment, one table per experiment module.
# Each value has a comment that names where it comes from: the paper section, table or
# figure that states it, prior work, or "chosen for this study".

[agent_ratings]
# Duplicate-dice trials per pairing; chosen for this study. The paper's runs pass 60 (appendix
# "Validity of the oracle rating", paragraph "Anchored round-robin"; appendix "Phase diagnostics and
# search ablation", paragraph "Learning curve").
pairs = 150
# Dice-bank seed; chosen for this study. The learning-curve run of the paper (appendix "Phase
# diagnostics and search ablation", paragraph "Learning curve") passes 20260628.
seed = 20260627
# Oracle evaluation depth: 0-ply, from the paper's section "Evaluation protocol", paragraph
# "Oracle".
plies = 0

[alpha_rank_clones]
# Alpha-rank selection intensities swept on every panel; chosen for this study, the same sweep as
# cyclic_triple's alpha-rank. The paper (appendix "Validity of the oracle rating", paragraph "Panel
# composition") reports the largest total-variation shift over this sweep.
alphas = [0.1, 1.0, 10.0, 100.0, 1000.0]
# Largest eigenvector-vs-linear-solve gap for a stationary distribution to count as resolved,
# and the tolerance for Nash averaging to count as clone-invariant; chosen for this study.
tolerance = 1e-6
# Agents with less alpha-rank mass than this are left out of the order comparison; chosen for
# this study.
mass_floor = 1e-6
# Tolerance for matching the Elo shifts of nash_averaging's clone cells: half of the one-decimal
# precision at which the paper (appendix "Validity of the oracle rating", paragraph "Panel
# composition") states Elo shifts.
elo_print_precision = 0.05
# Tolerance for the exact-reproduction controls (clone injection, cyclic_triple's alpha-rank and
# its stationary distributions); chosen for this study.
control_tolerance = 1e-9

[annotator_depth]
# Annotator search depths in ply. Paper: appendix "Validity of the oracle rating", paragraph "An
# oracle no stronger than the pool", and the table of PR at four search depths (columns 0-ply to
# 3-ply).
depths = [0, 1, 2, 3]
# Deepest pool member: the engine at 2 ply. Paper: appendix "Validity of the oracle rating",
# paragraph "An oracle no stronger than the pool" (the pool contains the engine at three of the four
# depths), and the table of PR at four search depths.
pool_max_ply = 2
# Agents in report order. Paper: appendix "Validity of the oracle rating", row order of the table of
# PR at four search depths.
agents = ["gnubg2", "gnubg1", "sel3", "puretd", "gnubg0", "search2"]
# Depth pairs compared. Chosen for this study; the paper quotes (0, 2) and (2, 3) in appendix
# "Validity of the oracle rating", paragraph "An oracle no stronger than the pool".
depth_pairs = [[0, 1], [0, 2], [0, 3], [1, 3], [2, 3]]
# Positions in the frozen suite. Paper: appendix "Validity of the oracle rating", paragraph "An
# oracle no stronger than the pool", and the caption of the table of PR at four search depths.
suite_size = 1000

[bearoff_domain]
# Minimum checkers borne off per side for a position to be in the exact bear-off table's domain; one
# checker off each side rules out gammons. Chosen for this study (the domain is the region of the
# paper's appendix "Validity of the oracle rating", paragraph "Exact-value check (bear-off)").
min_checkers_off = 1
# Suite phase label compared against the domain; the bear-off phase is defined in the paper's
# appendix "Phase diagnostics and search ablation", paragraph "Phases".
phase_label = "bearoff"

[bearoff_exact]
# Unforced decisions sampled on the bear-off slice: 1,500, from the paper's appendix "Validity of
# the oracle rating", paragraph "Exact-value check (bear-off)".
n_decisions = 1500
# Decision-sampling seed; chosen for this study. The bootstrap uses seed + 1.
seed = 227
# Bootstrap resamples of the decisions for the paired PR contrasts; chosen for this study.
n_bootstrap = 2000
# Quantiles of the 95% percentile bootstrap interval; chosen for this study. A pair separates when
# this interval excludes 0 (paper, appendix "Validity of the oracle rating", paragraph "Exact-value
# check (bear-off)").
interval_quantiles = [0.025, 0.975]
# Quantile of the absolute oracle equity error reported as p95_abs; chosen for this study.
error_quantile = 0.95
# PR = 500 x mean equity loss per unforced decision, from the paper's section "Evaluation protocol",
# paragraph "Rating" (the GNU Backgammon / eXtreme Gammon PR convention).
pr_scale = 500.0
# Most checkers still on per side in a sampled state (each placed uniformly on points 1-6);
# chosen for this study.
max_checkers_on = 14
# Decisions between progress lines; chosen for this study.
progress_every = 250

# Seven-agent panel (21 pairs), from the paper's appendix "Validity of the oracle rating", paragraph
# "Exact-value check (bear-off)". Checkpoint agents choose 1-ply greedy moves and gnubg plays at 0
# plies; checkpoint paths are relative to the repository root.
[[bearoff_exact.panel]]
name = "random"
spec = "random"

[[bearoff_exact.panel]]
name = "pubeval"
spec = "pubeval"

[[bearoff_exact.panel]]
name = "gnubg0"
spec = "gnubg:0"

[[bearoff_exact.panel]]
name = "ar_0053"
spec = "v2a"
checkpoint = "models/ar_0053.pt"

[[bearoff_exact.panel]]
name = "ar_0102"
spec = "v2b"
checkpoint = "models/ar_0102.pt"

[[bearoff_exact.panel]]
name = "champion"
spec = "v2c"
checkpoint = "models/champion.pt"

[[bearoff_exact.panel]]
name = "cp_r237"
spec = "v2d"
checkpoint = "models/cp_0215.pt"

# Settings of the decision-suite build (python -m active_oracle_evaluation.experiments.build_suite).
# The defaults below build a small one-agent suite. The paper's frozen suite overrides them on the
# command line; the module docstring gives that command.

[build_suite]
# Agent specs that drive self-play. Chosen for this study as a quick default. The paper's suite uses
# eight agents (appendix "Experimental protocol", paragraph "Frozen decision suite and active
# selection": 300 decisions per agent).
agents = ["random"]
# Total unforced decisions, split evenly across agents with the remainder to the last agent. Chosen
# for this study as a quick default. The paper's suite has 2,400 decisions (appendix "Experimental
# protocol", paragraph "Frozen decision suite and active selection").
n = 200
# Base seed; agent i uses seed + i. Chosen for this study; it is the project's global seed
# (README, Pinning section: per-agent seeds 20260628 to 20260635).
seed = 20260628
# Oracle search depth for the labels. The paper fixes the oracle at 0-ply (section "Evaluation
# protocol", paragraph "Oracle").
plies = 0
# Cap on plies per self-play game. Chosen for this study.
max_plies = 400

# Settings of the design-source comparison
# (python -m active_oracle_evaluation.experiments.cheap_steering).

[cheap_steering]
# Label budgets K. The paper reports every budget of this list (appendix "Experimental protocol":
# the columns of the table of mean Kendall tau under plain-mean and Horvitz-Thompson ranking, and
# paragraph "Margins over uniform sampling": "at every budget").
ks = [50, 100, 250, 500, 1000]
# Draws per budget. The paper uses 400 draws on the full panel (appendix "Experimental protocol",
# paragraph "Margins over uniform sampling").
seeds = 400
# Noise levels of the noisy:sigma designs, in units of the regret matrix standard deviation.
# Chosen for this study.
sigmas = [0.25, 0.5, 1.0, 2.0, 4.0]
# Base of the noise seed; a draw uses noise_seed_base + int(1000 * sigma) + seed.
# Chosen for this study.
noise_seed_base = 90000

[clone_invariance]
# Label budgets K; chosen for this study, a subset of the budgets of the paper's appendix
# "Experimental protocol", paragraph "Frozen decision suite and active selection".
ks = [100, 250, 500, 1000]
# Selection draws per budget and rule (seeds 0 to seeds - 1); the paper (appendix "Validity of the
# oracle rating", paragraph "Panel composition") states "over 200 draws".
seeds = 200
# The four selection rules of the paper's appendix "Experimental protocol", paragraph "Frozen
# decision suite and active selection".
strategies = ["random", "phase_balanced", "disagreement", "active_rank"]
# Active-rank steers on the losses of the agents the selector sees; chosen for this study.
importance = "skyline"
# A paired difference counts as a change when it exceeds this many standard errors; the paper
# (appendix "Validity of the oracle rating", paragraph "Panel composition") states "two standard
# errors".
flag_standard_errors = 2
# Agent pinned at 0 Elo; the paper's sections "Related work" and "Evaluation protocol" anchor Elo to
# pubeval. The fallback, pinned when pubeval is the duplicated agent, is chosen for this study.
anchor = "pubeval"
anchor_fallback = "v2"
# The eight-agent panel of the paper's appendix "Validity of the oracle rating", paragraph "Panel
# composition", as named in the 18-agent score cache.
base_panel = ["random", "heuristic", "pubeval", "v1", "v2", "ppo", "az75", "dxlarge"]

# Near-duplicate families in the 18-agent score cache; each adds the siblings of a base agent
# (az75 and dxlarge are in the base panel). Chosen for this study.
[clone_invariance.clone_families]
az = ["az25", "az50"]
distill = ["dlarge", "dphasecap"]
rollout = ["rblended", "rdisag", "rscaled"]

# Settings of the subset rating-validity analysis
# (python -m active_oracle_evaluation.experiments.cluster_validity).
# The resampling seed is not set here: it is the seed stored in the input round-robin file.

[cluster_validity]
# Elo-resampling replicates for the Kendall tau interval. Chosen for this study.
tau_ci_reps = 2000
# Percentiles of the Elo-resampling tau interval (a 95% percentile interval). Chosen for this
# study.
tau_ci_percentiles = [2.5, 97.5]
# A subset passes when its agent-clustered slope interval excludes 0 and its tau permutation
# p-value is below this threshold. Chosen for this study.
p_threshold = 0.05
# Significant figures at which the all8 refit is compared with the tau, slope and R^2 stored in
# the input file. Chosen for this study.
match_sig_figs = 3

# Agent subsets on which Elo is refit. Order within a subset does not matter: it is re-derived
# from PR and Elo.
[cluster_validity.subsets]
# The full eight-agent panel (paper, appendix "Validity of the oracle rating", paragraph "Anchored
# round-robin").
all8 = ["random", "heuristic", "pubeval", "v1", "v2", "ppo", "az", "distilled"]
# The panel without the random player. Chosen for this study.
no_random = ["heuristic", "pubeval", "v1", "v2", "ppo", "az", "distilled"]
# The competitive cluster, the six agents other than the heuristic and random players (paper,
# caption of the label-efficiency figure in the results subsection "Active selection orders the
# competitive cluster from fewer labels"; appendix "Statistical protocol: derivations and
# definitions", paragraph "Rank agreement", reports tau = 1.0 on it).
no_random_heuristic = ["pubeval", "v1", "v2", "ppo", "az", "distilled"]
# The learned agents only. Chosen for this study.
learned_only = ["v1", "v2", "ppo", "az", "distilled"]
# The four closest agents at the top of the panel. Chosen for this study.
inner4 = ["az", "pubeval", "v2", "ppo"]

# Settings of the cyclic-triple experiment
# (python -m active_oracle_evaluation.experiments.cyclic_triple).
# The paper states the construction only in words (appendix "Validity of the oracle rating",
# paragraph "Transitivity and a reversal": three agents that share one network and play at full
# strength only against a designated opponent). Every value below is chosen for this study unless
# its comment says otherwise.

[cyclic_triple]
# Signature point of cycle agents 0, 1 and 2 (each agent's own-point numbering). Chosen for this
# study.
signature_points = [1, 2, 3]
# Near-best equity window in which an agent keeps its signature blot. Chosen for this study.
delta = 0.05
# Wider window for the first early_moves decisions of each game. Chosen for this study.
delta_early = 0.12
early_moves = 12
# Probability of a uniformly random move in weak mode. Chosen for this study.
eps = 0.35
# Consecutive prey sightings that switch an agent to strong play for the rest of the game.
# Chosen for this study.
sticky_k = 2
# A board counts as a new game when its summed point difference from the start position is at
# most this. Chosen for this study.
new_game_max_diff = 4
# Prefix of each agent's RNG seed string "<prefix>:<agent>:<seed>". Chosen for this study.
agent_seed_prefix = "ct0231"

# Round robin. Duplicate-dice pairs per pairing (split into n_shards shards, so 400 gives
# 396 pairs = 792 games per pairing) and parallel worker processes. Chosen for this study.
pairs = 400
workers = 15
n_shards = 6
# Shard s of pairing p uses dice seed dice_seed_base * (p + 1) + s and agent seed
# agent_seed_base * (p + 1) + s (the opponent uses agent seed + 1). Chosen for this study.
dice_seed_base = 100
agent_seed_base = 1000
# Cycle certified when every edge's z score exceeds this. Chosen for this study.
cycle_min_z = 2

# Performance Rating suite. Sampler i (from 0) builds positions_per_sampler positions with seed
# suite_seed + sampler_seed_step * (i + 1). Chosen for this study.
samplers = ["heuristic", "v2:models/v2.pt"]
positions_per_sampler = 2000
suite_seed = 20260811
sampler_seed_step = 1000
# Oracle search depth for the suite labels. The paper fixes the oracle at 0-ply (section "Evaluation
# protocol", paragraph "Oracle").
oracle_plies = 0
# Seed of the reference and cycle agents and of the bootstrap intervals in the suite scores.
# Chosen for this study.
eval_seed = 231

# Ratings. Alpha-rank selection intensities (method of Omidshafiei et al., 2019). Chosen for
# this study.
alphas = [0.1, 1.0, 10.0, 100.0, 1000.0]
# Bradley-Terry fit: maximum iterations and convergence tolerance. Chosen for this study.
bt_iterations = 5000
bt_tolerance = 1e-12
# Largest |A p*| accepted for the exact Nash equilibrium of the 3-cycle. Chosen for this study.
nash_tolerance = 1e-12

# Settings of the rating-validity experiment
# (python -m active_oracle_evaluation.experiments.elo_validity).

[elo_validity]
# Agent specs of the eight-agent panel: built-in agents by name, checkpoints as label:path relative
# to the repo root. From the paper's appendix "Validity of the oracle rating", the table of PR and
# anchored Elo of the eight agents.
agents = [
    "random",
    "heuristic",
    "pubeval",
    "v1:models/v1.pt",
    "v2:models/v2.pt",
    "ppo:models/ppo.pt",
    "az:models/az75.pt",
    "distilled:models/distilled.pt",
]
# Round-robin games per pairing for the Elo fit. From the paper's appendix "Validity of the oracle
# rating", paragraph "Anchored round-robin" (60 games per pairing).
games = 60
# Duplicate-dice pairs per pairing for PR. From the paper's appendix "Validity of the oracle
# rating", paragraph "Anchored round-robin" (60 duplicate-dice trials, 120 games, per pairing).
pairs = 60
# Oracle evaluation depth: 0-ply, from the paper's section "Evaluation protocol", paragraph
# "Oracle".
plies = 0
# Base seed of the round-robin and the dice bank. Chosen for this study; it is the project's
# global seed (README, Pinning section).
seed = 20260628
# Agent pinned at Elo 0. From the paper's appendix "Validity of the oracle rating", paragraph
# "Anchored round-robin" (pubeval pinned at 0).
anchor = "pubeval"
# Kendall tau at or above which the report calls the agreement strong (and, with a positive
# slope, says PR validates). Chosen for this study.
tau_strong = 0.8
# Kendall tau at or above which the report calls the agreement moderate. Chosen for this study.
tau_moderate = 0.5

# Settings of the equal-games recount of resolved cluster pairs
# (python -m active_oracle_evaluation.experiments.equal_games).
# The competitive cluster and the multiplicity level come from the validity_intervals experiment.

[equal_games]
# Bootstrap replicates: the paper's appendix "Validity of the oracle rating", paragraph "Anchored
# round-robin" ("2,000 replicates"). Must equal the validity_intervals setting for the full-data
# check.
n_boot = 2000
# Bootstrap seed. Chosen for this study; must equal the validity_intervals seed for the
# full-data check.
seed = 20260813
# Number of random half-samples of the trials. Chosen for this study.
halves = 20
# Seed of the random half-samples. Chosen for this study.
halves_seed = 20260910
# Games per pairing in the anchored-Elo round-robin: the paper's results subsection "Oracle regret
# predicts head-to-head play, but less well among near-tied agents", and appendix "Validity of the
# oracle rating", paragraph "Anchored round-robin".
elo_games_per_pairing = 60
# Percentiles of the bootstrap interval (a 95% interval): the paper's results subsection "Oracle
# regret predicts head-to-head play, but less well among near-tied agents" ("95% intervals").
interval_percentiles = [2.5, 97.5]
# Largest allowed absolute difference between the full-data intervals and the stored ones.
# Chosen for this study.
control_tolerance = 1e-6
# Normal quantile of the Wilson 95% interval on each cluster pair's head-to-head win rate: the
# paper's appendix "Validity of the oracle rating", paragraph "Anchored round-robin" ("Wilson 95%
# interval"), and appendix "Statistical protocol: derivations and definitions" (win rates carry
# Wilson score intervals).
wilson_z = 1.96

# Settings of the estimator baselines at a matched label budget
# (python -m active_oracle_evaluation.experiments.estimator_baselines).

[estimator_baselines]
# Label budgets K: the paper's appendix "Experimental protocol", paragraph "Frozen decision suite
# and active selection" (K in {50, 100, 250, 500, 1000}).
ks = [50, 100, 250, 500, 1000]
# Replicate draws per (estimator, K): the paper's appendix "Statistical protocol: derivations and
# definitions", caption of the estimator table (estimators of the full-suite 2-ply PR) ("over 200
# draws per budget").
seeds = 200
# Uniform floor of the active design: the paper's appendix "Experimental protocol", paragraph
# "Frozen decision suite and active selection" (epsilon = 0.1).
eps = 0.1
# Seed of draw s is draw_seed_base + s, shared by the uniform, PPS and LURE draws.
# Chosen for this study.
draw_seed_base = 10000
# Seed of the sequential-halving run of draw s is halving_seed_base + s. Chosen for this study.
halving_seed_base = 20000
# Lower clip of the importance in the LURE proposal and in sequential halving, which keeps
# every proposal weight positive. Chosen for this study.
importance_floor = 1e-12
# Agents left out of the predictor-correlation range in the report. Chosen for this study.
untrained_agents = ["heuristic", "random"]
# Estimator whose RMSE at the largest K the saving is measured against: the paper's appendix
# "Statistical protocol: derivations and definitions", caption of the estimator table (estimators of
# the full-suite 2-ply PR) ("uniform sampling's RMSE at 1,000 labels").
saving_baseline = "classical"

# Settings of the estimator interval-coverage experiment
# (python -m active_oracle_evaluation.experiments.estimator_interval_coverage).

[estimator_interval_coverage]
# Draw counts per (estimator, K). 200 is the draw count of the estimator table (estimators of the
# full-suite 2-ply PR) in the paper's appendix "Statistical protocol: derivations and definitions"
# (caption: 200 draws per budget), and the control compares the first draw count with that table's
# CSVs. 1000 is chosen for this study; the 90.5% cluster coverage in the same appendix, paragraph
