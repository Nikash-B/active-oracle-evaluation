seeds = [200, 1000]
# Label budgets K. The same budgets as the estimator_baselines --ks default; chosen for this study.
# The estimator table in the paper's appendix "Statistical protocol: derivations and definitions"
# reports K = 1000.
ks = [50, 100, 250, 500, 1000]
# Uniform floor of the active design: the eval_select default (DEFAULT_EPS), chosen for this
# study.
eps = 0.1
# Normal quantile of the 95% intervals. The paper's intervals are nominal 95% (appendix "Statistical
# protocol: derivations and definitions", paragraph "Estimator baselines at matched label budget").
z_95 = 1.96
# Budget shown in the summary. From the estimator table in the paper's appendix "Statistical
# protocol: derivations and definitions" (at 1,000 labels).
report_k = 1000
# Estimators shown in the summary; the JSON holds all of them. Chosen for this study.
report_estimators = ["classical", "ht_active", "lure_active", "ppi_plus"]
# The competitive cluster: the six strongest agents, all eight without random and heuristic. From
# the paper's introduction (the term "competitive cluster") and appendix "Statistical protocol:
# derivations and definitions", paragraph "Estimator baselines at matched label budget" (on the
# cluster).
cluster_agents = ["pubeval", "v1", "v2", "ppo", "az", "distilled"]

# Settings of the XG match export (python -m active_oracle_evaluation.experiments.export_xg_match).

[export_xg_match]
# Number of suite games to export. From the paper: appendix "Validity of the oracle rating",
# paragraph "Second engine", and the table of PR under GNU Backgammon and eXtreme Gammon ("60
# self-play games").
n = 60
# Seed of the decision suite. Chosen for this study; it is the project's global seed, shared with
