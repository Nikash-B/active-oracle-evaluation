# ground truth", paragraph "Reference strength and shared error").
draws = 1
# Tolerance of the check that a reference's on-policy regret equals its skill gap.
# Chosen for this study.
regret_tolerance = 1e-9

# Settings of the Yahtzee trials-to-resolve experiment
# (python -m active_oracle_evaluation.experiments.yahtzee_trials).

[yahtzee_trials]
# On-policy games simulated per agent to measure the regret SD. Chosen for this study.
games = 5000
# Agents left out of the comparison. Chosen for this study: fixed_order ties almost every
# option, and the exact evaluator and the simulator break those ties differently.
exclude = ["fixed_order"]
# Simulation seed; agent i in panel order uses seed + i. Chosen for this study.
seed = 20260901
# Seed of the noisy agents of the panel. Chosen for this study; it must equal the seed of
# data/yahtzee/yahtzee_panel.json (python -m active_oracle_evaluation.experiments.yahtzee_panel).
panel_seed = 20260831
# Normal quantile of the interval criterion. From the paper: a 95% interval on the difference
# excludes zero (section "In a solved game, suite regret recovers the ranking but not the
# magnitudes", paragraph "Per-decision scoring pays most near optimal play"; appendix "Statistical
# protocol: derivations and definitions", paragraph "Sample-size relation").
interval_quantile = 0.975
# Power of the second criterion. From the paper: "a test at 80% power" (appendix "Statistical
# protocol: derivations and definitions", paragraph "Sample-size relation").
power = 0.80
# Largest allowed |V*(start) - 254.5877|. The anchor is from the paper (appendix "Solitaire Yahtzee:
# exact ground truth", paragraph "The solved game"); the tolerance is chosen for this study.
v_star_tolerance = 5e-5
# Largest allowed |z| of the simulated score and regret means against their exact values.
# Chosen for this study.
z_limit = 5
# Largest allowed |SD of optimal - 59.61|. The anchor is from the paper (appendix "Solitaire
# Yahtzee: exact ground truth", paragraph "The solved game"); the tolerance is chosen for this
# study.
sd_tolerance = 0.01
